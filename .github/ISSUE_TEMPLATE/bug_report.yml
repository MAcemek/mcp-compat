name: Bug report
description: mcp-compat reported something wrong, crashed or left a process running.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and the output or error message. Remove any secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server
      description: The MCP server and SDK version, if you know them.
  - type: input
    id: version
    attributes:
      label: mcp-compat version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: How do you run it?
      placeholder: npx on Windows with Node.js 24, or the GitHub Action
